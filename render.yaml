# Render blueprint for the FORESIGHT scoring service (D6).
# Render dashboard -> New -> Blueprint -> pick this repo. Free plan is enough.
services:
  - type: web
    name: foresight-scoring
    runtime: python
    plan: free
    buildCommand: pip install -r service/requirements.txt
    startCommand: uvicorn service.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
